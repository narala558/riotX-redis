apiVersion: batch/v1
kind: Job
metadata:
  name: riotx-redis-cluster-migration
  namespace: redis-migration
  labels:
    app.kubernetes.io/name: riotx
    app.kubernetes.io/component: redis-cluster-migration
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: riotx
        app.kubernetes.io/component: redis-cluster-migration
    spec:
      serviceAccountName: riotx-redis-migration
      restartPolicy: Never
      containers:
        - name: riotx
          image: riotx/riotx:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - exec riotx replicate "$RIOT_SOURCE_URI" "$RIOT_TARGET_URI"
          envFrom:
            - configMapRef:
                name: riotx-redis-migration-config
          env:
            - name: RIOT_SOURCE_USER
              valueFrom:
                secretKeyRef:
                  name: riotx-redis-credentials
                  key: source-user
                  optional: true
            - name: RIOT_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: riotx-redis-credentials
                  key: source-password
                  optional: true
            - name: RIOT_TARGET_USER
              valueFrom:
                secretKeyRef:
                  name: riotx-redis-credentials
                  key: target-user
                  optional: true
            - name: RIOT_TARGET_PASS
              valueFrom:
                secretKeyRef:
                  name: riotx-redis-credentials
                  key: target-password
                  optional: true
          ports:
            - name: metrics
              containerPort: 8080
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
