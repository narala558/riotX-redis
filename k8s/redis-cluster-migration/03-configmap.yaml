apiVersion: v1
kind: ConfigMap
metadata:
  name: riotx-redis-migration-config
  namespace: redis-migration
  labels:
    app.kubernetes.io/name: riotx
    app.kubernetes.io/component: redis-cluster-migration
data:
  # Use one or more Redis Cluster seed nodes, comma-separated.
  # Kubernetes example:
  # redis://source-redis-0.source-redis-headless.redis.svc.cluster.local:6379,source-redis-1.source-redis-headless.redis.svc.cluster.local:6379
  # TLS example:
  # rediss://source-node-1.example.com:6379,source-node-2.example.com:6379,source-node-3.example.com:6379
  RIOT_SOURCE_URI: "redis://SOURCE_CLUSTER_SEED_HOST:6379"
  RIOT_TARGET_URI: "redis://TARGET_CLUSTER_SEED_HOST:6379"

  RIOT_SOURCE_CLUSTER: "true"
  RIOT_TARGET_CLUSTER: "true"

  # SCAN performs a snapshot migration and the Job exits when complete.
  # LIVE performs scan plus change capture and requires source keyspace notifications.
  # LIVEONLY captures live changes only.
  RIOT_SYNC_MODE: "SCAN"

  RIOT_THREADS: "4"
  RIOT_BATCH: "100"
  RIOT_RETRY: "10"
  RIOT_SKIP: "0"
  RIOT_SOURCE_POOL: "16"
  RIOT_TARGET_POOL: "16"
  RIOT_SOURCE_TIMEOUT: "60s"
  RIOT_TARGET_TIMEOUT: "60s"
  RIOT_COMPARE: "QUICK"

  # Optional filters. Leave blank to migrate all keys and data types.
  RIOT_KEY_PATTERN: ""
  RIOT_KEY_TYPE: ""

  RIOT_LOG: "INFO"
  RIOT_PROGRESS: "ASCII"
  RIOT_METRICS: "true"
  RIOT_METRICS_JVM: "true"
  RIOT_METRICS_REDIS: "false"
  RIOT_METRICS_PORT: "8080"

  # Set TLS to true, or use rediss:// URIs.
  RIOT_SOURCE_TLS: "false"
  RIOT_TARGET_TLS: "false"
  RIOT_SOURCE_INSECURE: "false"
  RIOT_TARGET_INSECURE: "false"
  RIOT_SOURCE_TLS_VERIFY: "FULL"
  RIOT_TARGET_TLS_VERIFY: "FULL"
